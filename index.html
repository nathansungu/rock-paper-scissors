<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="header">
      <div class="main-header"><h1>rock paper scissors game</h1></div>
      <div class="score">
        <div class="copyright">&copy; Nathan Amudavi 20205</div>
        <div class="score-marks">
          <span class="score-player"
            >Player:
            <p class="player"></p
          ></span>
          <span class="score-computer"
            >  <p class="computer"></p>
            :computer
            
          </span>
        </div>
      </div>
    </section>
    <section class="game">
        <div class=" choices-area">
            <h2>computer</h2>
            <div class="image-picked">
                <img src="" alt="computer choice" class="computer-choice" />
            </div>
            
        </div>
    </section>
    <script src="index.js"></script>
  </body>
</html>
